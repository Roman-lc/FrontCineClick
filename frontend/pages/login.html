<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClick - Login</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand"><a href="../index.html">🎬 CineClick</a></div>
            <button class="nav-toggle" id="navToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="funciones.html">Funciones</a></li>
                <li><a href="grupo.html">Grupo</a></li>
                <li id="navAdmin" style="display:none;"><a href="admin.html">Panel Admin</a></li>
                <li id="navLogin"><a href="login.html">Login</a></li>
                <li id="navUser" style="display:none;"><span id="userName"></span> <a href="#" id="btnLogout">Salir</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <h2>Iniciar Sesión</h2>
            <div class="form form-center">
                <label>Email</label>
                <input type="email" id="email" placeholder="usuario@email.com" />
                
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" />
                
                <div id="errorDiv" class="alert alert-danger" style="display:none;"></div>
                
                <button type="button" id="btnLogin" class="btn btn-primary">Iniciar Sesión</button>
                
                <div class="alert alert-info" style="margin-top: 0.5rem;">
                    <strong>Usuario demo:</strong><br>
                    Admin: admin@cineclick.com / admin123
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CineClick - TPO Aplicaciones Interactivas</p>
    </footer>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/login.js"></script>
    <script>
        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navMenu').classList.toggle('active');
        });
    </script>
</body>
</html>
