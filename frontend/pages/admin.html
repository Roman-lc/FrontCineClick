<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClick - Panel Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header id="siteHeader"></header>

    <main>
        <section class="section">
            <h2>Panel de Administrador</h2>
            <div class="alert alert-warning">
                ⚠️ Solo acceso para usuarios con rol ADMIN
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
                <a href="admin-funciones.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">🎭 Gestionar Funciones</a>
                <a href="admin-peliculas.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">🎬 Gestionar Películas</a>
                <a href="admin-cines.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">🏢 Gestionar Cines y Salas</a>
                <a href="admin-clientes.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">👥 Gestionar Clientes</a>
                <a href="admin-promociones.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">🎟️ Gestionar Promociones</a>
                <a href="admin-compras.html" class="btn btn-primary" style="padding: 1rem; text-align: center;">💳 Gestionar Compras</a>
            </div>
        </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="../assets/js/auth.js"></script>
    <script src="../components/layout.js"></script>
    <script src="../assets/js/comun.js"></script>
    <script src="../assets/js/fechas.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof requireAdmin === 'function') requireAdmin();
            if (typeof updateNavbar === 'function') updateNavbar();
        });
</script>
</body>
</html>
