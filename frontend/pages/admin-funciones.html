<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClick - Admin Funciones</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header id="siteHeader"></header>

    <main>
        <section class="section">
            <a href="admin.html" class="btn btn-secondary" style="margin-bottom: 1rem;">← Volver al Panel</a>
            <h2>Gestionar Funciones</h2>
            <div class="admin-actions">
                <a href="admin-create.html" class="btn btn-primary">+ Agregar Nueva Función</a>
            </div>
            <div id="loading" class="loading">Cargando funciones...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Película</th>
                            <th>Cine / Sala</th>
                            <th>Fecha y Hora</th>
                            <th>Precio</th>
                            <th>Formato</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="../assets/js/auth.js"></script>
    <script src="../components/layout.js"></script>
    <script src="../assets/js/comun.js"></script>
    <script src="../assets/js/fechas.js"></script>
    <script src="../assets/js/admin-funciones.js"></script>
</body>
</html>
