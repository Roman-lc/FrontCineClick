<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClick - Funciones</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .filtros-activos {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            margin-bottom: 1rem;
            font-size: 0.88rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand"><a href="../index.html">🎬 CineClick</a></div>
            <button class="nav-toggle" id="navToggle">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="funciones.html">Funciones</a></li>
                <li><a href="grupo.html">Grupo</a></li>
                <li id="navAdmin" style="display:none;"><a href="admin.html">Panel Admin</a></li>
                <li id="navLogin"><a href="login.html">Login</a></li>
                <li id="navUser" style="display:none;"><span id="userName"></span> <a href="#" id="btnLogout">Salir</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <a href="../index.html" id="volverCartelera" class="btn btn-secondary" style="margin-bottom: 1rem;">← Volver a Cartelera</a>
            <h2 id="tituloFunciones">Funciones Disponibles</h2>
            <p id="subtituloFunciones" style="margin-bottom: 1.5rem; color: var(--text-light);">Seleccioná una función para ver el detalle o comprar tus entradas</p>
            
            <div id="loading" class="loading">Cargando funciones...</div>
            <div id="error" class="error" style="display:none;"></div>

            <div id="filtrosActivos" class="filtros-activos" style="display:none;">
                <span id="filtrosActivosTexto"></span>
                <button type="button" id="btnQuitarFiltros" class="btn btn-secondary btn-sm">Ver todas las funciones</button>
            </div>

            <div id="funcionesList"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CineClick - TPO Aplicaciones Interactivas</p>
    </footer>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/comun.js"></script>
    <script src="../assets/js/fechas.js"></script>
    <script src="../assets/js/funciones.js"></script>
    <script>
        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navMenu').classList.toggle('active');
        });
    </script>
</body>
</html>
