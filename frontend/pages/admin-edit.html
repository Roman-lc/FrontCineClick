<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClick - Modificar Función</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header id="siteHeader"></header>

    <main>
        <section class="section">
            <a href="admin.html" class="btn btn-secondary" style="margin-bottom: 1rem;">← Volver al Panel</a>
            <h2>Modificar Función</h2>
            
            <div class="form form-large">
                <label>Película *</label>
                <select id="peliculaId">
                </select>
                
                <label>Cine *</label>
                <select id="cineId">
                </select>
                
                <label>Sala *</label>
                <select id="salaId">
                </select>
                
                <label>Fecha y Hora *</label>
                <input type="datetime-local" id="fechaHora" />
                
                <label>Precio Base *</label>
                <input type="number" id="precioBase" step="0.01" />
                
                <label>Formato *</label>
                <select id="formato">
                    <option value="DOS_D">2D</option>
                    <option value="TRES_D">3D</option>
                    <option value="IMAX">IMAX</option>
                </select>
                
                <label>Idioma *</label>
                <input type="text" id="idioma" />
                
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                    <button type="button" id="btnGuardar" class="btn btn-primary">Guardar Cambios</button>
                    <a href="admin.html" class="btn btn-secondary">Cancelar</a>
                </div>
            </div>
        </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="../assets/js/auth.js"></script>
    <script src="../components/layout.js"></script>
    <script src="../assets/js/admin-edit.js"></script>
</body>
</html>
